# Render Blueprint - SGI PROTEGE Frotas
# Provisiona banco PostgreSQL + web service automaticamente.

services:
  - type: web
    name: sgi-protege-frotas
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sgi-protege-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: sgi-protege-db
    plan: free
    databaseName: sgi_protege
    user: sgi_user
